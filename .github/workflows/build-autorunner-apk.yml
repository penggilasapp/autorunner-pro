name: Build AutoRunner Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract AutoRunner Pro ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "::error::No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/autorunner-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/autorunner-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/autorunner-source" -type f -name 'settings.gradle.kts' -printf '%h\n' | while read -r d; do if [ -f "$d/app/build.gradle.kts" ]; then echo "$d"; break; fi; done)"
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "::error::Could not find an Android Gradle project (settings.gradle.kts + app/build.gradle.kts) inside the ZIP."
            find "$RUNNER_TEMP/autorunner-source" -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRunner-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
