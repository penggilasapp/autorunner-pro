name: Build AutoRunner Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' ! -name 'build-autorunner-apk.zip' -print -quit)"
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: Upload the AutoRunner Pro project ZIP to the repository root first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/autorunner-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/autorunner-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/autorunner-source" -type f -name 'gradlew' -printf '%h\n' | head -n 1)"
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: Could not find gradlew in the uploaded ZIP."
            echo "The ZIP may not contain the Android Gradle project or may require a different layout."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRunner-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
