name: Build AutoRunner Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract AutoRunner Pro source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./autorunner-pro-v0.4.3-kotlin-fix.zip"
          EXTRACT_DIR="$RUNNER_TEMP/autorunner-source"
          PROJECT_REL="extracted_android/PENGGILAS_ZIP_RUNNER_ANDROID"
          PROJECT_DIR="$EXTRACT_DIR/$PROJECT_REL"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::ZIP sumber tidak ditemukan atau kosong."
            exit 1
          fi

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()

              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or "\\" in name:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

              required = [
                  "extracted_android/PENGGILAS_ZIP_RUNNER_ANDROID/settings.gradle.kts",
                  "extracted_android/PENGGILAS_ZIP_RUNNER_ANDROID/app/build.gradle.kts",
                  "extracted_android/PENGGILAS_ZIP_RUNNER_ANDROID/app/src/main/AndroidManifest.xml",
                  "extracted_android/PENGGILAS_ZIP_RUNNER_ANDROID/app/src/main/java/com/penggilas/ziprunner/MainActivity.kt",
              ]

              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit(
                      "Struktur proyek tidak sesuai: " + ", ".join(missing)
                  )

          print("Validasi struktur ZIP berhasil.")
          PY

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] ||
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Direktori proyek Android tidak ditemukan."
            exit 1
          fi

          if ! grep -q 'applicationId = "com.penggilas.ziprunner"' \
            "$PROJECT_DIR/app/build.gradle.kts"; then
            echo "::error::Identitas aplikasi tidak cocok."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SHA-256 ZIP sumber:"
          sha256sum "$ZIP_FILE"
          echo "Sumber build: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Normalize app version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$BUILD_FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()

          if 'applicationId = "com.penggilas.ziprunner"' not in content:
              raise SystemExit("applicationId tidak cocok.")

          content, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              'versionCode = 7',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "0.4.3"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Konfigurasi versi tidak ditemukan.")

          path.write_text(content)
          print("Versi build: 0.4.3 (versionCode 7)")
          PY

          grep -E 'applicationId|versionCode|versionName' "$BUILD_FILE"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK identity and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi

          if [ ! -x "$AAPT" ]; then
            echo "::error::aapt tidak tersedia."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -5

          if ! printf '%s\n' "$BADGING" |
            grep -Fq "package: name='com.penggilas.ziprunner' versionCode='7' versionName='0.4.3'"; then
            echo "::error::Identitas atau versi APK tidak sesuai."
            exit 1
          fi

          echo "APK berhasil diverifikasi."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRunner-Pro-v0.4.3-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
