name: Build AutoRunner Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract AutoRunner Pro ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./autorunner-pro-v0.4.3-kotlin-fix.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::ZIP v0.4.3 tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "Menggunakan ZIP: $ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/autorunner-source"
          mkdir -p "$EXTRACT_DIR"

          EXPECTED_ZIP_ENTRIES=(
            "settings.gradle.kts"
            "app/build.gradle.kts"
            "gradlew"
            "gradlew.bat"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
          )

          while IFS= read -r entry; do
            entry="${entry#./}"
            if [ -z "$entry" ] || [ "$entry" = "/" ] || [[ "$entry" == */ ]]; then
              continue
            fi

            is_expected=false
            for expected in "${EXPECTED_ZIP_ENTRIES[@]}"; do
              if [ "$entry" = "$expected" ] || [[ "$entry" == */"$expected" ]]; then
                is_expected=true
                break
              fi
            done

            if [ "$is_expected" = false ]; then
              echo "::error::ZIP berisi file yang tidak diharapkan: $entry"
              exit 1
            fi
          done < <(unzip -Z1 "$ZIP_FILE")

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          mapfile -t PROJECT_DIRS < <(
            find "$EXTRACT_DIR" \
              -type f -name 'settings.gradle.kts' -printf '%h\n' |
            while read -r d; do
              if [ -f "$d/app/build.gradle.kts" ]; then
                printf '%s\n' "$d"
              fi
            done
          )

          if [ "${#PROJECT_DIRS[@]}" -eq 0 ]; then
            echo "::error::Proyek Android Gradle tidak ditemukan."
            find "$EXTRACT_DIR" \
              -maxdepth 6 -type f | head -100
            exit 1
          fi

          if [ "${#PROJECT_DIRS[@]}" -gt 1 ]; then
            echo "::error::Ditemukan lebih dari satu direktori proyek Android yang cocok:"
            printf ' - %s\n' "${PROJECT_DIRS[@]}"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIRS[0]}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek Android: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.9 fallback
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle wrapper and build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_CMD=""

          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          elif command -v gradle >/dev/null 2>&1; then
            echo "::warning::Gradle wrapper tidak ditemukan. Menggunakan Gradle global sebagai fallback."
            GRADLE_CMD="$(command -v gradle)"
          else
            echo "::error::Gradle wrapper dan Gradle global tidak tersedia."
            exit 1
          fi

          echo "Menggunakan Gradle: $GRADLE_CMD"
          "$GRADLE_CMD" --version
          "$GRADLE_CMD" --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRunner-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
